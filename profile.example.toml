# Own-bot TiendaCables crawl profile (schema 1).
# Known exclusions and ignored parameters are the visible subset only.
# Do not guess the remaining 15 parameter names or extra paths.
# Completing this list and claiming Semrush scope parity needs a full text export.
# Secret values are not stored here; they are read from the named environment variables.

schema_version = 1
role = "own_bot"

start_url = "https://www.tiendacables.com/"
# Configured crawl ceiling. Not a catalogue size.
max_pages = 20000
# Historical Semrush observation; not an invariant and not catalogue size.
observed_pages_baseline = 3725

# Independently identified client. Do not impersonate Semrush.
user_agent = "Crawlytic/0.1 (self-hosted SEO audit)"

discovery_mode = "homepage_internal_links"
# Semrush showed "minimum"; no numeric rate was exposed.
crawl_delay = "minimum"
javascript_rendering = false
bypass_robots = false
bypass_meta = false
password_authentication = false
web_bot_auth_required = true

# Empty means the whole origin is eligible, subject to exclusions.
allow_subfolders = []

# No trailing slash: string prefix (/shoes matches /shoes-men).
# Trailing slash: that folder's pages (/shoes/ does not match /shoes-men).
exclude_paths = [
  "/en/collections/vendors",
  "/collections/vendors",
  "/en/search",
  "/en/collections/types",
  "/en/blogs/noticias/tagged/",
  "/search",
]

# Skip the URL when any listed parameter is present. strip is a separate mode.
ignored_parameter_mode = "skip"
parameter_names_case_sensitive = true
skip_parameters = [
  "gad_source",
  "buyer_flags",
  "amp",
  "options[prefix]",
  "sort_by",
  "type",
  "gad_campaignid",
  "mot_S",
  "tw_kwdid",
  "variant",
  "tw_campaign",
  "fbclid",
]

# Weekly Monday intent only. Time and timezone are unspecified; no scheduler.
schedule_cadence = "weekly"
schedule_weekday = "monday"
completion_email = false

auth_signature_env = "CRAWL_SIGNATURE"
auth_signature_input_env = "CRAWL_SIGNATURE_INPUT"
auth_signature_agent_env = "CRAWL_SIGNATURE_AGENT"

ignored_parameters_captured = 12
ignored_parameters_source_count = 27
exclude_paths_complete = false
lists_complete = false
